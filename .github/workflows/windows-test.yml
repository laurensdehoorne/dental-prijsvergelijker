# Diagnose op een echte Windows-machine: bouwt de app, start hem en opent een
# loginvenster zoals de knop 'Inloggen' dat doet. Handmatig starten ("Run workflow").
name: Windows-test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean prijsvergelijker.spec
      - name: App starten en loginvenster openen
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/Prijsvergelijker/Prijsvergelijker.exe
          $app = Start-Process $exe -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 2
            try { Invoke-RestMethod http://localhost:8765/api/status | Out-Null; $ok = $true; break } catch {}
          }
          "server bereikbaar: $ok"
          Invoke-RestMethod -Method Post http://localhost:8765/api/login/basiq | ConvertTo-Json
          Start-Sleep 25
          "--- processen"
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'Prijsvergelijker|chrome|msedge|node' } |
            ForEach-Object { "{0} {1}" -f $_.ProcessId, $_.CommandLine.Substring(0, [Math]::Min(220, $_.CommandLine.Length)) }
          "--- open tabbladen via debugpoort"
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'remote-debugging-port=(\d+)' } | ForEach-Object {
            $port = [regex]::Match($_.CommandLine, 'remote-debugging-port=(\d+)').Groups[1].Value
            try { (Invoke-RestMethod "http://127.0.0.1:$port/json") | ForEach-Object { "$($_.type) $($_.url)" } } catch { "poort ${port}: $($_.Exception.Message)" }
          }
          "--- status"
          (Invoke-RestMethod http://localhost:8765/api/status).basiq | ConvertTo-Json
          "--- log.txt"
          Get-Content "$env:APPDATA\Prijsvergelijker\log.txt" -ErrorAction SilentlyContinue
          "--- sessiebestand"
          Get-ChildItem "$env:APPDATA\Prijsvergelijker\sessions" -ErrorAction SilentlyContinue
          $j = Get-Content "$env:APPDATA\Prijsvergelijker\sessions\basiq.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          "cookies in sessiebestand: $($j.cookies.Count) -> $(($j.cookies | ForEach-Object name) -join ', ')"
          Get-Process Prijsvergelijker, chrome -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Regressie - login met __COMPAT_LAYER en Edge (v1.0.3)
        shell: pwsh
        run: |
          # Zo erfde het loginproces de omgeving van de app op de Windows-pc van de gebruiker:
          # Edge herstartte zichzelf, login.py dacht dat het venster dicht was -> 0 cookies.
          Get-Process Prijsvergelijker, chrome, msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          Remove-Item "$env:APPDATA\Prijsvergelijker\sessions\basiq.json", "$env:APPDATA\Prijsvergelijker\log.txt" -ErrorAction SilentlyContinue
          $env:__COMPAT_LAYER = "Installer"
          $env:PRIJSVERGELIJKER_BROWSER = "edge"
          $exe = Resolve-Path dist/Prijsvergelijker/Prijsvergelijker.exe
          Start-Process $exe -ArgumentList "--login", "basiq"
          Start-Sleep 30
          "--- browserprocessen"
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'msedge|chrome' -and $_.CommandLine -match 'profiles\\basiq' -and $_.CommandLine -notmatch '--type=' } |
            ForEach-Object { "{0} {1}" -f $_.Name, $_.CommandLine.Substring(0, [Math]::Min(260, $_.CommandLine.Length)) }
          $relaunch = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'edge-skip-compat-layer-relaunch' }
          "Edge herstart door compat layer: $([bool]$relaunch)"
          "--- log.txt"
          Get-Content "$env:APPDATA\Prijsvergelijker\log.txt" -ErrorAction SilentlyContinue
          $j = Get-Content "$env:APPDATA\Prijsvergelijker\sessions\basiq.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          $n = if ($j) { $j.cookies.Count } else { 0 }
          "cookies in sessiebestand: $n"
          Get-Process Prijsvergelijker, msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($n -lt 1) { Write-Error "REGRESSIE: geen cookies bewaard met __COMPAT_LAYER"; exit 1 }
