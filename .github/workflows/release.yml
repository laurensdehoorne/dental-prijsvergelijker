# Bouwt de app voor Mac en Windows en maakt een GitHub-release.
# Starten: een versie-tag pushen, bv.  git tag v1.0.1 && git push origin v1.0.1
# (Handmatig starten via "Run workflow" bouwt enkel, zonder release.)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: Prijsvergelijker-mac.zip
          - os: windows-latest
            asset: Prijsvergelijker-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # pythonnet (Windows-venster) loopt achter op de nieuwste Python
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean prijsvergelijker.spec
      - name: Inpakken (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Prijsvergelijker.app ${{ matrix.asset }}
      - name: Inpakken (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Prijsvergelijker -DestinationPath ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            ## Installeren

            **Mac** — download `Prijsvergelijker-mac.zip`, pak uit en sleep **Prijsvergelijker** naar *Apps*.
            De eerste keer: rechtsklik op de app → **Open** → **Open** (de app is niet door Apple ondertekend).

            **Windows** — download `Prijsvergelijker-windows.zip`, pak uit (bv. in *Documenten*) en start
            `Prijsvergelijker.exe`. Toont Windows "Windows heeft uw pc beschermd": klik **Meer info** → **Toch uitvoeren**.
            Tip: rechtsklik op `Prijsvergelijker.exe` → **Vastmaken aan Start**.

            Inloggen bij de winkels gebeurt in Google Chrome (op Windows anders Microsoft Edge).
            Je logins, favorieten en instellingen blijven bewaard bij een update.
          generate_release_notes: true
